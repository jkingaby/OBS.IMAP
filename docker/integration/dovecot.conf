protocols = imap
listen = 127.0.0.1
log_path = /tmp/dovecot.log
info_log_path = /tmp/dovecot-info.log
ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = </tmp/imap.crt
ssl_key = </tmp/imap.key
disable_plaintext_auth = yes
auth_mechanisms = plain login
mail_location = maildir:~/Maildir
mail_uid = 2000
mail_gid = 2000
first_valid_uid = 2000
passdb {
  driver = static
  args = password=fixture-password
}
userdb {
  driver = static
  args = uid=2000 gid=2000 home=/srv/mail/%u
}
namespace inbox {
  inbox = yes
  separator = /
  mailbox Archive {
    auto = create
  }
}
service imap-login {
  inet_listener imap {
    port = 1143
  }
  inet_listener imaps {
    port = 1993
    ssl = yes
  }
}
